<style>
/* Layout: one narrow column — big search box on top, result cards below, like a counter ledger */
:root{
  --bg:#f5f6f3; --surface:#ffffff; --fg:#1d221f; --muted:#5f6862; --line:#dde1dc;
  --accent:#1f6f54; --accent-fg:#ffffff; --chip:#e7efe9; --warn:#a14a1a;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141816; --surface:#1c211e; --fg:#e8ece9; --muted:#9aa49d; --line:#2e3531;
  --accent:#5cc49c; --accent-fg:#0d1511; --chip:#24302a; --warn:#f0a070; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141816; --surface:#1c211e; --fg:#e8ece9; --muted:#9aa49d; --line:#2e3531;
  --accent:#5cc49c; --accent-fg:#0d1511; --chip:#24302a; --warn:#f0a070; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-block:28px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
h1{font-size:22px;margin:0;font-weight:700;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.search{display:flex;gap:8px}
#q{flex:1;min-width:0;font:500 20px var(--mono);padding:14px 16px;border:2px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--fg);text-transform:lowercase}
#q:focus{outline:none;border-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{font:500 13px var(--sans);padding:6px 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--muted);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.status{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.status b{color:var(--fg)}
.note{color:var(--warn);font-size:13px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;
  display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.card>div{min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.code{font:500 17px var(--mono);color:var(--accent)}
.src{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
.name{font-weight:500;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.url{font:500 12px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.acts{display:flex;flex-direction:column;gap:6px}
.acts a,.acts button{font:500 13px var(--sans);padding:8px 12px;border-radius:8px;text-align:center;text-decoration:none;cursor:pointer;white-space:nowrap}
.acts a{background:var(--accent);color:var(--accent-fg);border:1px solid var(--accent)}
.acts button{background:transparent;color:var(--fg);border:1px solid var(--line)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
@media (max-width:480px){.card{grid-template-columns:1fr}.acts{flex-direction:row}.acts>*{flex:1}}
</style>

</head>

function search(raw) {
  let q = raw.trim().toLowerCase().replace(/\s+/g, "");
  let note = "";
  if (/^ms\d+$/.test(q)) { note = "ms 코드는 없어서 sm" + q.slice(2) + "로 찾았습니다."; q = "sm" + q.slice(2); }
  let rows = DATA.filter(r => src === "전체" || r[0] === src);
  if (!q) return { rows: [], note };
  let m;
  if (/^[a-z]{1,3}-?\d+$/.test(q)) {
    const code = q.replace("-", "");
    m = rows.filter(r => r[1].toLowerCase() === code);
  } else if (/^\d+$/.test(q)) {
    const n = parseInt(q, 10);
    m = rows.filter(r => parseInt(r[1].replace(/\D/g, ""), 10) === n || String(r[2]) === q);
  } else {
    const words = raw.trim().toLowerCase().split(/\s+/);
    m = rows.filter(r => { const t = (r[3] + " " + r[4]).toLowerCase(); return words.every(w => t.includes(w)); });
  }
  return { rows: m, note };
}

    <div class="acts"><a target="_blank" rel="noopener">신상마켓 열기</a><button type="button">링크 복사</button></div>`;
  el.querySelector(".code").textContent = code;
  el.querySelector(".src").textContent = s;
  el.querySelector(".name").textContent = name;
  el.querySelector(".meta").textContent = [colors, "판매 " + won(price), "상품번호 " + id].filter(Boolean).join(" · ");
  el.querySelector(".url").textContent = link(id);
  el.querySelector("a").href = link(id);
  const btn = el.querySelector("button");
  btn.onclick = () => {
    const done = () => { btn.textContent = "복사됨"; setTimeout(() => btn.textContent = "링크 복사", 1500); };
    navigator.clipboard?.writeText(link(id)).then(done).catch(() => {
      const r = document.createRange(); r.selectNodeContents(el.querySelector(".url"));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); btn.textContent = "Ctrl+C로 복사";
    }) ?? done();
  };
  return el;
}

function render() {
  const raw = $("q").value;
  const { rows, note } = search(raw);
  $("note").hidden = !note; $("note").textContent = note;
  const list = $("list"); list.innerHTML = "";
  if (!raw.trim()) {
    $("status").innerHTML = `상품 <b>${DATA.length.toLocaleString()}</b>개 · ${SOURCES.slice(1).join(" · ")} · ${UPDATED} 기준`;
    return;
  }
  $("status").innerHTML = `<b>${rows.length}</b>개 찾음`;
  if (!rows.length) {
    list.innerHTML = `<div class="empty">이 코드는 목록에 없습니다. 번호만 넣거나 상품명으로 찾아보세요.</div>`;
    return;
  }
  rows.slice(0, 60).forEach(r => list.appendChild(card(r)));
  if (rows.length > 60) $("status").innerHTML += " (앞 60개만 표시)";
}
$("q").addEventListener("input", render);
const start = new URLSearchParams(location.search).get("q") || (location.hash.length > 1 ? decodeURIComponent(location.hash.slice(1)) : "sm136");
$("q").value = start;
render();
</script>
